{% load socialaccount %}
<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Sign up</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet"/>
</head>
<body class="bg-slate-50 dark:bg-slate-900 font-[Inter] min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-200/70 dark:border-slate-700/60 p-8">
    <div class="flex flex-col items-center text-center">
      <div class="w-14 h-14 rounded-xl bg-emerald-100 dark:bg-emerald-900/40 text-emerald-600 dark:text-emerald-300 flex items-center justify-center mb-4">
        <svg class="w-8 h-8" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 100 20 10 10 0 000-20Z" opacity=".15"/><path d="M7 10a5 5 0 0110 0v4a5 5 0 11-10 0v-4Zm5-3a3 3 0 00-3 3v4a3 3 0 006 0v-4a3 3 0 00-3-3Z"/></svg>
      </div>
      <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Create your account</h1>
      <p class="text-slate-600 dark:text-slate-400 mt-1">Get started with AI Call Assistant</p>
    </div>

    <div class="mt-8 space-y-4">
      <a href="{% provider_login_url 'google' %}"
         class="w-full inline-flex items-center justify-center gap-3 h-11 px-4 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-800 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-600 transition">
        <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 10.2v3.7h5.2c-.2 1.2-1.5 3.6-5.2 3.6-3.1 0-5.7-2.6-5.7-5.7S8.9 6.1 12 6.1c1.8 0 3 .8 3.7 1.5l2.5-2.4C16.8 3.7 14.6 2.8 12 2.8 6.9 2.8 2.8 6.9 2.8 12s4.1 9.2 9.2 9.2c5.3 0 8.8-3.7 8.8-9 0-.6-.1-1-.2-1.4H12z"/><path fill="#34A853" d="M3.7 7.4l3 2.2C7.5 7.8 9.6 6.1 12 6.1c1.8 0 3 .8 3.7 1.5l2.5-2.4C16.8 3.7 14.6 2.8 12 2.8 8.4 2.8 5.3 4.8 3.7 7.4z"/><path fill="#4A90E2" d="M12 21.2c3.2 0 5.9-2.1 6.8-5l-3-2.3c-.8 2.3-3.1 3.6-5.3 3.6-2.5 0-4.7-1.7-5.4-3.9l-3 2.3c1.5 3.1 4.7 5.3 8.9 5.3z"/><path fill="#FBBC05" d="M21.2 12c0-.6-.1-1-.2-1.4H12v3.7h5.2c-.2 1.2-1.5 3.6-5.2 3.6-2.5 0-4.7-1.7-5.4-3.9l-3 2.3c1.5 3.1 4.7 5.3 8.9 5.3 5.3 0 8.8-3.7 8.8-9z"/></svg>
        <span>Continue with Google</span>
      </a>
    </div>

    <div class="mt-6 text-center text-sm text-slate-600 dark:text-slate-400">
      Already have an account?
      <a href="/accounts/login/" class="text-emerald-600 dark:text-emerald-400 hover:underline">Sign in</a>
    </div>
  </div>
</body>
</html>
