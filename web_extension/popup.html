<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Voldio Recorder</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 12px; width: 320px; }
    .row { margin-bottom: 8px; }
    button { padding: 8px 12px; font-weight: 700; }
    #status { font-size: 12px; color: #666; }
  </style>
</head>
<body>
  <div class="row">
    <label><input type="checkbox" id="includeSystem" /> Include system audio</label>
  </div>
  <div class="row">
    <label>Title: <input type="text" id="title" placeholder="Meeting title" /></label>
  </div>
  <div class="row">
    <button id="start">Start Recording</button>
    <button id="stop" disabled>Stop</button>
  </div>
  <div id="status">Idle</div>
  <script src="popup.js"></script>
</body>
</html>
